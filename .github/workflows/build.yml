name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      release_version: ${{ steps.version.outputs.release_version }}
      is_release: ${{ steps.version.outputs.is_release }}
      signed: ${{ steps.name.outputs.signed }}
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      # version.txt holds the release version (e.g. 1.0.0). A signed build on
      # main publishes release v<version> once; every other build is a test
      # build named <version>-build<N>. To release again, bump version.txt.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SEED: ${{ secrets.SIGNING_SEED != '' }}
        run: |
          V=$(tr -d ' \r\n' < version.txt)
          IS_RELEASE=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
             && [ "$HAS_SEED" = "true" ] && ! gh release view "v$V" >/dev/null 2>&1; then
            IS_RELEASE=true
          fi
          if [ "$IS_RELEASE" = "true" ]; then VN="$V"; else VN="$V-build${BUILD_NUMBER}"; fi
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          {
            echo "version_name=$VN"
            echo "release_version=$V"
            echo "is_release=$IS_RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VN (release: $IS_RELEASE)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :shared:test :desktop:test testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log" || { scripts/report_errors.sh "$RUNNER_TEMP/test.log"; exit 1; }

      # The signing key is rebuilt from one GitHub Secret (SIGNING_SEED).
      # Nothing secret is stored in the repo. See scripts/derive_keystore.py.
      - name: Rebuild signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SEED: ${{ secrets.SIGNING_SEED }}
        run: |
          if [ -z "$SIGNING_SEED" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::A release needs the SIGNING_SEED secret. Add it in Settings > Secrets and variables > Actions, then re-run."
              exit 1
            fi
            echo "::warning::SIGNING_SEED secret not set - this is a TEST build signed with a throwaway key. It will not update over other builds."
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          pip install --quiet "cryptography>=42"
          PW=$(python3 -I scripts/derive_keystore.py "$RUNNER_TEMP/release.p12")
          echo "::add-mask::$PW"
          {
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
            echo "SIGNING_STORE_PASSWORD=$PW"
            echo "SIGNING_KEY_PASSWORD=$PW"
            echo "SIGNING_KEY_ALIAS=fbrclients"
            echo "SIGNED=yes"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" || { scripts/report_errors.sh "$RUNNER_TEMP/build.log"; exit 1; }

      - name: Name the APK
        id: name
        run: |
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.p12"
          mkdir -p out
          SUFFIX=""; [ "$SIGNED" = "yes" ] || SUFFIX="-TEST"
          cp app/build/outputs/apk/release/app-release.apk "out/FBR-Clients-${VERSION_NAME}${SUFFIX}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # The database schema Room wrote during the build (to keep in the repo).
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

  # The Windows PC app (desktop/), packaged as an .msi installer.
  windows:
    needs: build
    runs-on: windows-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the Windows installer
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :desktop:packageMsi 2>&1 | tee "$RUNNER_TEMP/msi.log" || { scripts/report_errors.sh "$RUNNER_TEMP/msi.log"; exit 1; }
          mkdir -p out
          cp desktop/build/compose/binaries/main/msi/*.msi "out/FBR-Clients-PC-${{ needs.build.outputs.version_name }}.msi"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: out/*.msi

  # Pull requests only: pictures of the PC screens (made-up data) as a private draft release, for review.
  screens:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Draw the screens
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/screens
        run: |
          set -o pipefail
          ./gradlew --no-daemon :desktop:test --tests pk.fbrclients.desktop.ScreenshotTest 2>&1 | tee "$RUNNER_TEMP/shots.log" || { scripts/report_errors.sh "$RUNNER_TEMP/shots.log"; exit 1; }
          ls -l "$SCREENSHOTS_DIR"
      - name: Save as draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and .name=="Review screens") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create "review-screens-${{ github.run_number }}" "$RUNNER_TEMP"/screens/*.png \
            --draft --title "Review screens" --target "${{ github.event.pull_request.head.sha }}" --notes "Made-up data. Draft only."

  # Pull requests only: open the real PC browser on IRIS and a bill page (made-up login) and keep pictures as a draft.
  browser-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Open the browser
        shell: bash
        env:
          BROWSER_SMOKE_DIR: ${{ runner.temp }}/browser
        run: |
          set -o pipefail
          ./gradlew --no-daemon :desktop:test --tests pk.fbrclients.desktop.BrowserSmokeTest 2>&1 | tee "$RUNNER_TEMP/smoke.log" || { scripts/report_errors.sh "$RUNNER_TEMP/smoke.log"; exit 1; }
          ls -l "$BROWSER_SMOKE_DIR" || true
          cat "$BROWSER_SMOKE_DIR/log.txt" || true
      - name: Save as draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and .name=="Review browser") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create "review-browser-${{ github.run_number }}" "$RUNNER_TEMP"/browser/* \
            --draft --title "Review browser" --target "${{ github.event.pull_request.head.sha }}" --notes "Made-up data. Draft only."

  publish:
    needs: [build, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: out
      - name: Files
        run: ls -l out
      # A fixed "latest build" release gives the owner one link to open on the phone.
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove every old "latest-build" release (including stuck drafts),
          # move the tag to this commit, then publish a fresh release.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name=="latest-build") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin refs/tags/latest-build
          gh release create latest-build out/* \
            --verify-tag \
            --latest=false \
            --prerelease \
            --title "Latest build (${VERSION_NAME})" \
            --notes "Built from ${GITHUB_SHA::7}. Signed with release key: ${SIGNED}. Phone: download the .apk on your phone and open it to install. PC (Windows): download the .msi and open it."
          # Fail loudly if the release did not end up public.
          test "$(gh release view latest-build --json isDraft --jq .isDraft)" = "false"

      # First signed build of a new version.txt -> a permanent release.
      - name: Publish release
        if: needs.build.outputs.is_release == 'true' && needs.build.outputs.signed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${RELEASE_VERSION}" out/* \
            --target "$GITHUB_SHA" \
            --latest \
            --title "FBR Clients ${VERSION_NAME}" \
            --notes "Signed release ${VERSION_NAME}. Phone: download the .apk on your phone and open it to install; it updates any earlier signed build and keeps your data. PC (Windows): download the .msi and open it."
