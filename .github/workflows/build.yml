name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      # version.txt holds the release version (e.g. 1.0.0). A signed build on
      # main publishes release v<version> once; every other build is a test
      # build named <version>-build<N>. To release again, bump version.txt.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SEED: ${{ secrets.SIGNING_SEED != '' }}
        run: |
          V=$(tr -d ' \r\n' < version.txt)
          IS_RELEASE=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
             && [ "$HAS_SEED" = "true" ] && ! gh release view "v$V" >/dev/null 2>&1; then
            IS_RELEASE=true
          fi
          if [ "$IS_RELEASE" = "true" ]; then VN="$V"; else VN="$V-build${BUILD_NUMBER}"; fi
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "Version $VN (release: $IS_RELEASE)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :shared:test testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log" || { scripts/report_errors.sh "$RUNNER_TEMP/test.log"; exit 1; }

      # The signing key is rebuilt from one GitHub Secret (SIGNING_SEED).
      # Nothing secret is stored in the repo. See scripts/derive_keystore.py.
      - name: Rebuild signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SEED: ${{ secrets.SIGNING_SEED }}
        run: |
          if [ -z "$SIGNING_SEED" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::A release needs the SIGNING_SEED secret. Add it in Settings > Secrets and variables > Actions, then re-run."
              exit 1
            fi
            echo "::warning::SIGNING_SEED secret not set - this is a TEST build signed with a throwaway key. It will not update over other builds."
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          pip install --quiet "cryptography>=42"
          PW=$(python3 -I scripts/derive_keystore.py "$RUNNER_TEMP/release.p12")
          echo "::add-mask::$PW"
          {
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
            echo "SIGNING_STORE_PASSWORD=$PW"
            echo "SIGNING_KEY_PASSWORD=$PW"
            echo "SIGNING_KEY_ALIAS=fbrclients"
            echo "SIGNED=yes"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" || { scripts/report_errors.sh "$RUNNER_TEMP/build.log"; exit 1; }

      - name: Name the APK
        run: |
          rm -f "$RUNNER_TEMP/release.p12"
          mkdir -p out
          SUFFIX=""; [ "$SIGNED" = "yes" ] || SUFFIX="-TEST"
          cp app/build/outputs/apk/release/app-release.apk "out/FBR-Clients-${VERSION_NAME}${SUFFIX}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FBR-Clients-${{ env.VERSION_NAME }}
          path: out/*.apk

      # The database schema Room wrote during the build (to keep in the repo).
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      # A fixed "latest build" release gives the owner one link to open on the phone.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove every old "latest-build" release (including stuck drafts),
          # move the tag to this commit, then publish a fresh release.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name=="latest-build") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin refs/tags/latest-build
          gh release create latest-build out/*.apk \
            --verify-tag \
            --latest=false \
            --prerelease \
            --title "Latest build (${VERSION_NAME})" \
            --notes "Built from ${GITHUB_SHA::7}. Signed with release key: ${SIGNED}. Download the .apk on your phone and open it to install."
          # Fail loudly if the release did not end up public.
          test "$(gh release view latest-build --json isDraft --jq .isDraft)" = "false"

      # First signed build of a new version.txt -> a permanent release.
      - name: Publish release
        if: env.IS_RELEASE == 'true' && env.SIGNED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${RELEASE_VERSION}" out/*.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "FBR Clients ${VERSION_NAME}" \
            --notes "Signed release ${VERSION_NAME}. Download the .apk on your phone and open it to install. It updates any earlier signed build and keeps your data."
